<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Prueba de partituras</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { background:#11141a; color:#f2f4f8; font-family:-apple-system,system-ui,sans-serif; padding:16px; }
      h2 { font-size:16px; margin:24px 0 4px; }
      p { margin:0 0 8px; color:#98a1b3; font-size:13px; }
      .hoja { background:#fff; border-radius:12px; padding:4px; }
    </style>
  </head>
  <body>
    <h1>Partituras del catálogo</h1>
    <p id="veredicto">Comprobando…</p>
    <div id="todo"></div>
    <script type="module">
      import { EJERCICIOS } from '/src/ejercicios/catalogo.ts'
      import { dibujarPartitura } from '/src/notacion/partitura.ts'

      const ancho = Math.min(document.body.clientWidth - 32, 760)
      const todo = document.getElementById('todo')
      const errores = []
      const desalineadas = []
      for (const ejercicio of EJERCICIOS) {
        const titulo = document.createElement('h2')
        titulo.textContent = `${ejercicio.titulo} — ${ejercicio.compas.pulsos}/${ejercicio.compas.figura}`
        const desc = document.createElement('p')
        desc.textContent = ejercicio.descripcion
        const hoja = document.createElement('div')
        hoja.className = 'hoja'
        todo.append(titulo, desc, hoja)
        try {
          const notas = dibujarPartitura(hoja, ejercicio, { ancho })
          // Lo que suena a la vez tiene que verse a la vez: mismo tick, misma x.
          const porTick = {}
          for (const n of notas) {
            const r = n.elemento?.getBoundingClientRect()
            if (r) (porTick[n.ticks] ||= []).push(r.x)
          }
          for (const [tick, xs] of Object.entries(porTick)) {
            if (xs.length < 2) continue
            const dif = Math.max(...xs) - Math.min(...xs)
            // Se comparan las cajas de las notas enteras, y una x de crash mide
            // distinto que una cabeza normal: por debajo de 5 px no es desalineación.
            if (dif > 5) desalineadas.push(`${ejercicio.id} (tick ${tick}): ${Math.round(dif)} px`)
          }
        } catch (e) {
          errores.push(`${ejercicio.id}: ${e.message}`)
          hoja.textContent = 'ERROR: ' + e.message
        }
      }
      window.__errores = errores
      window.__desalineadas = desalineadas
      const veredicto = document.getElementById('veredicto')
      if (errores.length === 0 && desalineadas.length === 0) {
        veredicto.textContent = 'Todo bien: ninguna partitura falla y las notas simultáneas están alineadas.'
        veredicto.style.color = '#56c271'
      } else {
        veredicto.textContent = 'Problemas: ' + [...errores, ...desalineadas].join(' · ')
        veredicto.style.color = '#ef6b6b'
      }
    </script>
  </body>
</html>
